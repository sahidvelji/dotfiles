[settings.task]
output = "interleave"

# Run beside the repo's Brewfile, which brew bundle reads as ./Brewfile.
# --global would miss it on a fresh Mac: the ~/.config/homebrew symlink does
# not exist until `mise bootstrap`, so brew falls back to ~/.Brewfile.
[tasks.brew-dump]
description = "Update Brewfile with current brew packages"
dir = "{{config_root}}/config/homebrew"
run = 'brew bundle dump --force --no-describe --no-mas --no-vscode --no-go --no-cargo --no-uv --no-flatpak --no-winget --no-krew --no-npm'

[tasks.brew-install]
description = "Install brew packages from Brewfile"
dir = "{{config_root}}/config/homebrew"
run = 'brew bundle'

[tools]
"aqua:Kampfkarren/selene" = "0.32.0"
"aqua:owenlamont/ryl" = "0.26.0"
betterleaks = "1.9.0"
biome = "2.6.2"
hk = { version = "2.9.0", workflow = "release.yml" }
"packslip:github.com/jdx/jactionlint" = { version = "2.3.0", workflow = "release.yaml" }
pkl = "0.32.2"
rumdl = "0.3.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
stylua = "2.6.0"
tombi = "1.9.1"
typos = "1.51.1"
