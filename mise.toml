# Run beside the repo's Brewfile, which brew bundle reads as ./Brewfile.
# --global would miss it on a fresh Mac: the ~/.config/homebrew symlink does
# not exist until `mise bootstrap`, so brew falls back to ~/.Brewfile.
[tasks.brew-dump]
description = "Update Brewfile with current brew packages"
dir = "{{config_root}}/config/homebrew"
run = 'brew bundle dump --force --no-describe --tap --formula --cask'

[tasks.brew-install]
description = "Install brew packages from Brewfile"
dir = "{{config_root}}/config/homebrew"
run = 'brew bundle'

[tools]
"aqua:Kampfkarren/selene" = "0.32.0"
"aqua:owenlamont/ryl" = "0.29.0"
betterleaks = "v1.10.0"
biome = "2.6.2"
hk = { version = "2.12.0", workflow = "release.yml" }
jactionlint = { version = "v2.5.0", workflow = "release.yaml" }
pkl = "0.33.0"
rumdl = "v0.3.2"
shellcheck = "0.11.0"
shfmt = "3.14.1"
stylua = "2.6.0"
tombi = "1.11.1"
typos = "1.52.2"
