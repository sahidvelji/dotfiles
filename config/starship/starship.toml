# Starship Prompt Configuration
# https://starship.rs/config/

# Two-line prompt: info on top, prompt character below
format = """
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
$docker_context\
$package\
$golang\
$nodejs\
$python\
$rust\
$java\
$terraform\
$aws\
$jobs\
$status\
$line_break\
$character"""

right_format = """$cmd_duration$time"""

add_newline = false

# --- Core Prompt ---

[character]
error_symbol = "[✖](bold red)"

[directory]
# truncate_to_repo would stop a linked worktree's path at the worktree itself,
# dropping the repo it belongs to, and it runs before substitutions. These
# substitutions do the same contraction for ~/repos, and keep the repo name for
# worktrees under its .claude/worktrees.
truncate_to_repo = false
substitutions = [
  { from = '^~/repos/([^/]+)/\.claude/worktrees/', to = '…/$1 ⎇ ', regex = true },
  { from = '^~/repos/', to = '…/', regex = true },
]
truncation_symbol = "…/"
style = "bold cyan"
repo_root_style = "bold blue"
before_repo_root_style = "dimmed cyan"

# --- Git ---

[git_branch]
truncation_length = 30

[git_status]
style = "bold red"

[git_metrics]
disabled = false

[git_commit]
tag_disabled = false
tag_symbol = " "

# --- Languages & Tools ---

[golang]
format = 'via [$symbol($version )($mod_version )]($style)'
symbol = " "

[python]
format = 'via [${symbol}(${version} )(\($virtualenv\) )]($style)'
symbol = " "
pyenv_prefix = ""

[rust]
symbol = " "

[java]
symbol = " "

[package]
symbol = " "

[terraform]
symbol = "󱁢 "

# --- Infrastructure ---

[docker_context]
symbol = " "

[aws]
format = 'on [$symbol($profile )(\($region\) )]($style)'
symbol = " "

# --- Utility ---

[cmd_duration]
min_time = 1_000
format = "[$duration]($style) "
style = "bold yellow"

[time]
disabled = false
format = "[$time]($style)"
style = "dimmed white"
time_format = "%H:%M"

[status]
disabled = false
symbol = ""
map_symbol = true
not_executable_symbol = " "
not_found_symbol = " "
sigint_symbol = " "
signal_symbol = " "

[jobs]
symbol = " "
