[settings.dotfiles]
root = "~/repos/dotfiles"

# gh keeps its token in the macOS Keychain, where mise cannot read it, so ask gh
# when mise needs one.
[settings.github]
credential_command = "gh auth token"

# Each group links every file under its root into the target and leaves
# unmanaged files there alone, such as Claude Code's runtime state in ~/.claude.
[dotfile_groups.config]
root = "config"
target = "~/.config"

# Repo copies of dotfiles drop the leading dot. hk.pkl and .editorconfig list
# the zsh startup files too.
[dotfile_groups.config.entries]
"~/.config/zsh/.zshrc" = { source = "zsh/zshrc" }

[dotfile_groups.local]
root = "local"
target = "~/.local"

[dotfile_groups.claude]
root = "claude"
target = "~/.claude"

[dotfiles]
# ~/.zshenv is the zsh bootstrap: it sets ZDOTDIR + XDG so the rest of the
# config loads from ~/.config/zsh. A relative source would resolve from
# ~/.config/mise, where this file is linked.
"~/.zshenv" = "~/repos/dotfiles/zshenv"

[bootstrap.user]
# Declarative login shell — `mise bootstrap` runs `chsh -s` only if it differs.
login_shell = "/bin/zsh"

# macOS preferences — only values that differ from stock macOS are declared.

[bootstrap.macos.dock]
orientation = "left"
tilesize = 20
mru_spaces = false  # fixed Space order — keeps Ctrl+1/2/3 stable
# Pinned apps, in order — mise owns `persistent-apps`. Every path must exist
# before a changed layout applies, so install the casks first.
apps = [
  "/System/Applications/Apps.app",
  "/System/Applications/Photos.app",
  "/System/Applications/App Store.app",
  "/System/Applications/System Settings.app",
  "/Applications/Google Chrome.app",
  "/Applications/Slack.app",
  "/Applications/Ghostty.app",
  "/Applications/Claude.app",
  "/Applications/Discord.app",
]

# Additive: apps not listed here stay in Open at Login. This is the one list of
# what starts at login.
[bootstrap.macos.login_items]
apps = [
  "/Applications/Bitwarden.app",
  "/Applications/Rectangle.app",
  "/Applications/Claude.app",
  "/Applications/Wispr Flow.app",
  "/Applications/Google Drive.app",
  "/Applications/Ghostty.app",
  "/Applications/Google Chrome.app",
]

[bootstrap.macos.finder]
show_all_files = true
preferred_view_style = "list"

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults."com.apple.dock"]
launchanim = false  # no bounce on app launch
"minimize-to-application" = true  # minimized windows tuck into app icon
"wvous-br-corner" = 0  # bottom-right ships as Quick Note; 0 = no-op
"wvous-br-modifier" = 0  # no modifier held

[bootstrap.macos.defaults.NSGlobalDomain]
AppleShowAllExtensions = true  # Finder shows every extension
AppleInterfaceStyle = "Dark"  # force dark mode
AppleShowScrollBars = "Always"  # scrollbars always visible
AppleKeyboardUIMode = 2  # Tab navigates all dialog controls
"com.apple.swipescrolldirection" = false  # natural scrolling off
NSAutomaticCapitalizationEnabled = false  # no auto-cap mid-sentence
NSAutomaticPeriodSubstitutionEnabled = false  # no double-space-to-period
AppleICUForce24HourTime = true  # 24-hour clock everywhere
# Raw + float: the friendly key_repeat/initial_key_repeat are integer-only, but
# macOS stores both as reals — an int reads back as a perpetual "Differs".
InitialKeyRepeat = 25.0  # delay before a held key repeats
KeyRepeat = 2.0  # fastest repeat once held

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
TrackpadRightClick = true  # two-finger secondary click (built-in trackpad)

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
TrackpadRightClick = true  # same, for Bluetooth trackpads

[bootstrap.macos.defaults."com.apple.finder"]
NewWindowTarget = "PfAF"  # new Finder windows open at Recents

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
ShowSeconds = true  # stock macOS hides seconds

[bootstrap.macos.defaults."com.apple.HIToolbox"]
AppleFnUsageType = 0  # Fn/Globe key does nothing (stock shows Emoji & Symbols)

# Rectangle (cask). App preferences belong here, not as a symlinked plist —
# cfprefsd caches those.
[bootstrap.macos.defaults."com.knollsoft.Rectangle"]
# Rectangle's own "Launch on login" checkbox. Login is handled by
# login_items above; this only keeps the checkbox in agreement.
launchOnLogin = true
allowAnyShortcut = true  # allow bindings Rectangle would otherwise reject
subsequentExecutionMode = 0  # what repeating a shortcut does
SUEnableAutomaticChecks = false  # no Sparkle auto-update checks
todo = 2  # Todo mode off
moveCursorAcrossDisplays = 2  # don't drag the cursor along to another display
toggleTodo = { keyCode = 11, modifierFlags = 786432 }  # ⌃⌥B
reflowTodo = { keyCode = 45, modifierFlags = 786432 }  # ⌃⌥N

# `-currentHost` preference: stored per machine, so it is invisible to the
# plain domains above and needs the explicit-entry form.
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.mouse.tapBehavior"
host = "current"
value = 1  # system-wide tap-to-click ("mouse" is legacy naming)

# Menu-bar battery percentage — a per-host Control Center preference.
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "BatteryShowPercentage"
host = "current"
value = true

# Dock and Control Center re-read these only on relaunch, and mise never kills
# apps itself.
[bootstrap.hooks.post-defaults]
run = "killall Dock ControlCenter || true"

[task_config]
dir = "{{cwd}}"

[tools]
"github:open-feature/cli" = "latest"
"github:seachicken/gh-poi" = { version = "latest", bin = "gh-poi" }
"go:golang.org/x/tools/cmd/deadcode" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
